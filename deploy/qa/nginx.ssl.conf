# nginx config for FBOS QA — TLS for api.dev.yougetfitwithus.com
#
# Companion to nginx.conf (HTTP-only). Swap the compose volume mount to this
# file ONLY AFTER the Let's Encrypt certificate exists, otherwise nginx fails
# to start (missing cert files). Full sequence: deploy/qa/SSL_SETUP.md
#
# Serves:
#   https://api.dev.yougetfitwithus.com
#     /api/    → Django backend (port 8000)
#     /static/ → collectstatic output
#     /media/  → media uploads
#   http://34.93.81.238 (default_server) → legacy IP access, unchanged:
#     /api/ → backend, /static/, /media/, / → Next.js frontend

# ── HTTP → HTTPS for the API host (also serves ACME challenges) ─────────
server {
    listen 80;
    server_name api.dev.yougetfitwithus.com;

    # Let's Encrypt webroot challenges (certbot writes into this mount)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else → TLS. Safe before the cert exists: certbot webroot
    # requests hit the location above on plain HTTP.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Legacy IP access (unchanged behaviour from nginx.conf) ──────────────
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # ── Django API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # ── Django static files (collectstatic output) ────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Django media uploads ──────────────────────────────────────────
    location /media/ {
        alias /app/media/;
    }

    # ── Next.js frontend (everything else) ────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── TLS API host ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.dev.yougetfitwithus.com;

    ssl_certificate     /etc/letsencrypt/live/api.dev.yougetfitwithus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.yougetfitwithus.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # ── Django API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # ── Django static files ────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Django media uploads ───────────────────────────────────────────
    location /media/ {
        alias /app/media/;
    }

    # API host — nothing else lives here
    location = / {
        return 200 'FBOS API\n';
        default_type text/plain;
    }

    location / {
        return 404;
    }
}