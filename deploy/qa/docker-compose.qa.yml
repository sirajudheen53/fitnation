# Docker Compose for FBOS QA environment (single GCP VM)
# Usage:
#   cp .env.qa.example .env.qa
#   docker compose -f deploy/qa/docker-compose.qa.yml up -d
#
# Services:
#   nginx     → reverse proxy + TLS termination (certbot for Let's Encrypt)
#   backend   → Django (gunicorn)
#   frontend  → Next.js standalone node server
#   db        → PostgreSQL (QA database, persistent volume)
#   redis     → cache + sessions

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: qa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - qa_net

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/qa/Dockerfile.backend
    container_name: qa-backend
    restart: unless-stopped
    env_file:
      - .env.qa
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.qa
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 3
             --worker-class sync
             --timeout 120"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - qa_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/qa/Dockerfile.frontend
    container_name: qa-frontend
    restart: unless-stopped
    env_file:
      - .env.qa
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://qa.fitnation.app/api/v1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - qa_net

  db:
    image: postgres:16-alpine
    container_name: qa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnation_qa}
      POSTGRES_USER: ${POSTGRES_USER:-fitnation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-qa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitnation} -d ${POSTGRES_DB:-fitnation_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qa_net

  redis:
    image: redis:7-alpine
    container_name: qa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qa_net

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:

networks:
  qa_net:
    driver: bridge
