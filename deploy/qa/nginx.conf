# nginx config for FBOS QA (single VM)
# Reverse proxy:
#   /api/  → Django backend  (port 8000)
#   /      → Next.js frontend (port 3000)
#
# TLS: Let's Encrypt via certbot (webroot). To obtain certs:
#   certbot certonly --webroot -w /var/www/certbot \
#     -d qa.fitnation.app --email admin@fitnation.app --agree-tos --no-eff-email

# ── HTTP: redirect to HTTPS ──────────────────────────────────────────────
server {
    listen 80;
    server_name qa.fitnation.app;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name qa.fitnation.app;

    # ── Let's Encrypt certificates (after certbot runs) ────────────────
    # Paths are mounted from ./certbot/conf
    ssl_certificate     /etc/letsencrypt/live/qa.fitnation.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.fitnation.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # ── Django API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # ── Django static files (collectstatic output) ────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Django media uploads ──────────────────────────────────────────
    location /media/ {
        alias /app/media/;
    }

    # ── Next.js frontend (everything else) ────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
