# nginx config for FBOS QA (single VM, no domain — IP only)
# Reverse proxy:
#   /api/  → Django backend  (port 8000)
#   /      → Next.js frontend (port 3000)
#
# When you get a domain later, switch to the SSL version with certbot.

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Django API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # ── Django static files (collectstatic output) ────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Django media uploads ──────────────────────────────────────────
    location /media/ {
        alias /app/media/;
    }

    # ── Next.js frontend (everything else) ────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}