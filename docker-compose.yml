# Docker Compose for FBOS local development
# Usage: docker compose up -d
# Backend: http://localhost:8000
# PostgreSQL: localhost:5432
# Redis: localhost:6379

services:
  db:
    image: postgres:16-alpine
    container_name: fitnation-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnation}
      POSTGRES_USER: ${POSTGRES_USER:-fitnation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitnation_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitnation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitnation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitnation-backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
  redis_data: