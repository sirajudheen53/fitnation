name: fitnation_app
description: "FitNation — Customer mobile app for FBOS"
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Device info
  device_info_plus: ^11.2.0

  # UI helpers
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

  # Platform interfaces (unit-test fakes for FirebaseAuth; direct deps so the
  # depend_on_referenced_packages lint passes on test imports).
  firebase_auth_platform_interface: ^9.1.2
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/